<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта курса</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: sticky trail bar on top, the rest of the screen is a pan/zoom board of cards and arrows */
:root {
  --bg: #eef1f1;
  --board: #f6f8f8;
  --dot: #d3dbdb;
  --card: #ffffff;
  --fg: #1b2324;
  --muted: #5d6b6c;
  --line: #c4cecf;
  --accent: #0f7f86;
  --bar: rgba(246, 248, 248, .92);
  --c1: #d9394e; --c2: #d76f0e; --c3: #b8900a; --c4: #1f9a52; --c5: #0d9aa0; --c6: #6c4fd8;
  --tint: 9%;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-head: "Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1415; --board: #131a1b; --dot: #253031; --card: #1a2224; --fg: #e4ecec; --muted: #93a3a4;
    --line: #3a4849; --accent: #3cc3c9; --bar: rgba(19, 26, 27, .92);
    --c1: #f0566a; --c2: #f08a2e; --c3: #e0b82a; --c4: #3cc874; --c5: #2cc6cb; --c6: #957bf2;
    --tint: 14%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1415; --board: #131a1b; --dot: #253031; --card: #1a2224; --fg: #e4ecec; --muted: #93a3a4;
  --line: #3a4849; --accent: #3cc3c9; --bar: rgba(19, 26, 27, .92);
  --c1: #f0566a; --c2: #f08a2e; --c3: #e0b82a; --c4: #3cc874; --c5: #2cc6cb; --c6: #957bf2;
  --tint: 14%; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.app { display: flex; flex-direction: column; height: 100%; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bar); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.trail { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; flex: 1 1 320px; font-size: 14px; }
.trail button { font: inherit; color: var(--muted); background: none; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trail button:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.trail .here { color: var(--fg); font-family: var(--font-head); font-weight: 700; font-size: 15px; padding: 4px 6px; overflow-wrap: anywhere; }
.trail .sep { color: var(--line); }
.tools { display: flex; gap: 6px; }
.tools button {
  font: 500 14px var(--font-body); color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-width: 36px;
}
.tools button:hover { border-color: var(--accent); }
.tools button:disabled { opacity: .4; cursor: default; }
button:focus-visible, .lnk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage {
  position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--board);
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 22px 22px;
}
.stage.drag { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

.node {
  position: absolute; box-sizing: border-box; overflow: auto;
  background: var(--card); border: 2px solid var(--line); border-radius: 10px;
  padding: 10px 14px; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere;
}
.node[data-c] { border-color: var(--cc); background: color-mix(in srgb, var(--cc) var(--tint), var(--card)); }
.node .h1 { font: 800 26px/1.2 var(--font-head); text-wrap: balance; margin: 0 0 4px; }
.node .h2 { font: 700 21px/1.25 var(--font-head); text-wrap: balance; margin: 0 0 2px; }
.node .h3 { font: 700 18px/1.3 var(--font-head); margin: 0 0 2px; }
.node p { margin: 0; }
.node p + p { margin-top: 4px; }
.node.up { border-style: dashed; background: transparent; display: flex; align-items: center; }
.lnk {
  color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline;
  text-decoration-thickness: 1px; text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; text-align: left;
}
.lnk:hover { text-decoration-thickness: 2px; }
.node.has-link { cursor: pointer; }
.node.has-link:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc, var(--accent)) 30%, transparent); }

.hint {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font-size: 13px; color: var(--muted); background: var(--bar); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  pointer-events: none; max-width: calc(100% - 32px);
}
.state[hidden] { display: none; }
.state { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; text-align: center; padding: 16px; }
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <nav class="trail" id="trail" aria-label="Путь по карте"></nav>
    <div class="tools">
      <button id="up" type="button" title="На уровень выше">↑ Выше</button>
      <button id="zout" type="button" title="Отдалить" aria-label="Отдалить">−</button>
      <button id="zin" type="button" title="Приблизить" aria-label="Приблизить">+</button>
      <button id="fit" type="button" title="Показать карту целиком">Вписать</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="world" id="world"></div>
    <div class="state" id="state">Загружаю карту…</div>
    <div class="hint" id="hint">Нажми на подчёркнутую ветку, чтобы открыть её. Тащи, чтобы двигать, колесо или щипок, чтобы масштабировать.</div>
  </main>
</div>

те эталону, раз не выполняете его желание","x":1060,"y":194,"width":380,"height":114,"color":"5"},{"id":"2ccedcc10a1c5a2e","type":"text","text":"Что мы делаем: Показываем через нарушение п-с связи, как он добавляет новые требования к соцроли/ценности","x":1060,"y":330,"width":380,"height":114,"color":"5"},{"id":"4a94aeb9d1c14bb4","type":"text","text":"Фиксация навязываемой соцроли от обратного","x":560,"y":657,"width":380,"height":88,"color":"5"},{"id":"a601df2bc71d21b9","type":"text","text":"Если я сделаю/не сделаю <что-то>, я буду/не буду <соцроль>?","x":1060,"y":466,"width":380,"height":88,"color":"5"},{"id":"480321f853b5cccb","type":"text","text":"Стоит мне тебе отказать и я стану неблагодарной дочкой в твоих глазах?","x":1060,"y":576,"width":380,"height":88,"color":"5"},{"id":"1ed385448b694f45","type":"text","text":"Что происходит: Манипулятор пугает/стыдит вас тем, что вы не соответствуете эталону, раз не выполняете его желание","x":1060,"y":686,"width":380,"height":114,"color":"5"},{"id":"77d7b9c0ce90e3d3","type":"text","text":"Что мы делаем: Показываем через нарушение п-с связи, как он добавляет новые требования к соцроли/ценности","x":1060,"y":822,"width":380,"height":114,"color":"5"},{"id":"2bb04389686a098d","type":"text","text":"Связь будущего и поступка","x":560,"y":1136,"width":380,"height":88,"color":"5"},{"id":"bc95ee4da4b123f6","type":"text","text":"Чтобы бы было <что-то>, я должен <что-то>?","x":1060,"y":958,"width":380,"height":88,"color":"5"},{"id":"cea7cc662b064e86","type":"text","text":"Чтобы рассчитывать на твою помощь в будущем, я должен помочь тебе сейчас?","x":1060,"y":1068,"width":380,"height":88,"color":"5"},{"id":"e596c2afad0600f4","type":"text","text":"Что происходит: Манипулятор ожидает, что вы испугаетесь лишения чего-то в будущем и сделаете, как он хочет.","x":1060,"y":1178,"width":380,"height":114,"color":"5"},{"id":"5b8db8cb8785df8d","type":"text","text":"Что мы делаем: Показываем нарушение п-с связи между будущим и поступком","x":1 ype":"text","text":"формальной (руководитель, сотрудник)","x":1560,"y":1154,"width":380,"height":62,"color":"1"},{"id":"3f538a3c75f1c564","type":"text","text":"Состоит из 2-х частей:","x":1060,"y":1196,"width":380,"height":62,"color":"1"},{"id":"714883643bafdf1b","type":"text","text":"неформальной (лидер, неопытный)","x":1560,"y":1238,"width":380,"height":62,"color":"1"},{"id":"6e23b400342056ac","type":"text","text":"Социальная группа объединяет людей по общему социальному признаку, связанных системой отношений, которые регулируются формальными и/или неформальными социальными институтами.","x":1060,"y":800,"width":380,"height":166,"color":"1"},{"id":"f4c1b9f872b5e320","type":"text","text":"Социальная группа","x":560,"y":852,"width":380,"height":62,"color":"1"},{"id":"55668fbb5711721c","type":"text","text":"Неформальная социальная роль (неопытный, наивный) - это то, как вас видит общество. Из-за нее в будущем может меняться ваша формальная социальная роль (руководитель или уволенный).","x":2000,"y":1186,"width":380,"height":166,"color":"1"},{"id":"0a608b15fdb31057","type":"text","text":"То, что вы не отработаете конфликт, не поменяет вашу социальную роль сразу... Но поменяет её, если вы проигнорируете конфликт несколько раз","x":1180,"y":1391,"width":380,"height":140,"color":"1"},{"id":"4dc4171376226926","type":"text","text":"Нарушение роли или границы","x":1180,"y":1553,"width":380,"height":62,"color":"1"},{"id":"aa961999adbd8b60","type":"text","text":"Повторение","x":1180,"y":1637,"width":380,"height":62,"color":"1"},{"id":"de70a9c3d2b26430","type":"text","text":"Закрепление новых ролей и/или границ","x":1180,"y":1721,"width":380,"height":62,"color":"1"},{"id":"b00ea3d7900b7036","type":"text","text":"Что будет, если не обработать конфликт?","x":560,"y":1380,"width":380,"height":88,"color":"1"},{"id":"660ab88c8a675927","type":"text","text":"Мы не можем вести переговоры, пока конфликт на них влияет","x":560,"y":1571,"width":380,"height":88,"color":"1"},{"id":"007933bd04a53412","type":"text","text":"Рационально говорить с человеком, когда он на эмоциях - опасно!","x":560,"y":1721,"width":380,"height":88,"color":"1"},{"id":"85386162967e21a9","type":"text","text":"Социальная роль","x":560,"y":1088,"width":380,"height":88,"color":"1"}],"edges":[{"id":"584ca0f1368aa7a4","fromNode":"f4c1b9f872b5e320","fromSide":"right","toNode":"6e23b400342056ac","toSide":"left","color":"1"},{"id":"cb2abde5a8b30913","fromNode":"85386162967e21a9","fromSide":"right","toNode":"74093b06c6ea7fbf","toSide":"left","color":"1"},{"id":"286f32e353ffd166","fromNode":"3f538a3c75f1c564","fromSide":"right","toNode":"4770005b2b37ae13","toSide":"left","color":"1"},{"id":"8f3556300b355d9d","fromNode":"3f538a3c75f1c564","fromSide":"right","toNode":"714883643bafdf1b","toSide":"left","color":"1"},{"id":"480ddcae2e46248f","fromNode":"85386162967e21a9","fromSide":"right","toNode":"3f538a3c75f1c564","toSide":"left","color":"1"},{"id":"d41af18a5acb8c8c","fromNode":"b00ea3d7900b7036","fromSide":"right","toNode":"0a608b15fdb31057","toSide":"left","color":"1"},{"id":"bed2e2afe24b7592","fromNode":"b00ea3d7900b7036","fromSide":"right","toNode":"4dc4171376226926","toSide":"left","color":"1"},{"id":"e8d5f2f5686ab657","fromNode":"b00ea3d7900b7036","fromSide":"right","toNode":"aa961999adbd8b60","toSide":"left","color":"1"},{"id":"158cd32e37cb121d","fromNode":"b00ea3d7900b7036","fromSide":"right","toNode":"de70a9c3d2b26430","toSide":"left","color":"1"},{"id":"53adb43dfb589e55","fromNode":"c82561ec215a6e31","fromSide":"right","toNode":"b00ea3d7900b7036","toSide":"left","color":"1"},{"id":"9ce8b671faa8c0ba","fromNode":"c82561ec215a6e31","fromSide":"right","toNode":"660ab88c8a675927","toSide":"left","color":"1"},{"id":"30501aa4a46ece6d","fromNode":"c82561ec215a6e31","fromSide":"right","toNode":"007933bd04a53412","toSide":"left","color":"1"},{"id":"14ebfda7e66c75bb","fromNode":"714883643bafdf1b","fromSide":"right","toNode":"55668fbb5711721c","toSide":"left","color":"1"}]},"Карта курса/Основные правила и пояснение.canvas":{"nodes":[{"id":"a16ab5954645cd05","type":"text","text":"# Основные правила и пояснение","x":0,"y":201,"width":440,"height":132,"color":"5"},{"id":"789bf4cfb3b16c4b","type":"text","text":"↑ [[Карта курса/Обработка эмоций. Первый этап работы с конфликтом.canvas]]","x":0,"y":91,"width":440,"height":70},{"id":"41d72e8577c42e00","type":"text","text":"Называйте эмоцию","x":600,"y":84,"width":380,"height":62,"color":"5"},{"id":"de0049b45f0a7f67","type":"text","text":"Не бойтесь повторить обработку","x":600,"y":168,"width":380,"height":62,"color":"5"},{"id":"12688d31cb725f7f","type":"text","text":"Будьте честными, иначе эмпатия не сработает","x":600,"y":252,"width":380,"height":88,"color":"5"},{"id":"0a3bab0a43b38d9d","type":"text","text":"Почему это работает:","x":180,"y":473,"width":380,"height":62,"color":"5"},{"id":"c855b58449b4b848","type":"text","text":"Называние эмоции помогает ее осознать","x":680,"y":460,"width":380,"height":62,"color":"5"},{"id":"78484adade101a07","type":"text","text":"Повторное переживание опыта снижает интенстивность эмоции","x":680,"y":544,"width":380,"height":88,"color":"5"},{"id":"cf1837d57d8592ab","type":"text","text":"Мы редко встречаемся с эмпатией","x":680,"y":360,"width":380,"height":62,"color":"5"}],"edges":[{"id":"139152ecf06b93c3","fromNode":"a16ab5954645cd05","fromSide":"right","toNode":"41d72e8577c42e00","toSide":"left","color":"5"},{"id":"2e256940229048f4","fromNode":"a16ab5954645cd05","fromSide":"right","toNode":"de0049b45f0a7f67","toSide":"left","color":"5"},{"id":"1cdeca366cd7ef38","fromNode":"a16ab5954645cd05","fromSide":"right","toNode":"12688d31cb725f7f","toSide":"left","color":"5"},{"id":"a0e9677a5110150a","fromNode":"0a3bab0a43b38d9d","fromSide":"right","toNode":"cf1837d57d8592ab","toSide":"left","color":"5"},{"id":"f9c4d9e12cdb5769","fromNode":"0a3bab0a43b38d9d","fromSide":"right","toNode":"c855b58449b4b848","toSide":"left","color":"5"},{"id":"428159d3ba6f9a1d","fromNode":"0a3bab0a43b38d9d","fromSide":"right","toNode":"78484adade101a07","toSide":"left","color":"5"}]},"Карта курса/Оценка vs Факт.canvas":{"nodes":[{"id":"8805a7e8617486fb","type":"text","text":"# Оценка vs Факт","x":0,"y":175,"width":440,"height":94,"color":"5"},{"id":"76ce4b8acbde3ed0","type":"text","text":"Оценка","x":560,"y":81,"width":380,"height":62,"color":"5"},{"id":"9b47a5cdb3cf5982","type":"text","text":"ваша интерпретация, другой человек может быть не согласен с ней, поэтому опасно ее использовать","x":1060,"y":0,"width":380,"height":114,"color":"5"},{"id":"864346e8bb67f334","type":"text","text":"Например: ты безответственно отнесся к моему заданию","x":1060,"y":136,"width":380,"height":88},{"id":"b2fff01809c4fabb","type":"text","text":"Факт","x":560,"y":314,"width":380,"height":62,"color":"5"},{"id":"bbfef1070ca6c01f","type":"text","text":"на что мы можем опираться, что реально произошло","x":1060,"y":246,"width":380,"height":88,"color":"5"},{"id":"836dcf01cbbf9fe8","type":"text","text":"Например: встреча была назначена в 10, а ты пришел в 10:20","x":1060,"y":356,"width":380,"height":88},{"id":"1c9cfa197fa7ce03","type":"text","text":"↑ [[Карта курса/Показывание границ. Второй этап работы с конфликтом.canvas]]","x":0,"y":65,"width":440,"height":70}],"edges":[{"id":"c44cb4f8cc13d6f3","fromNode":"76ce4b8acbde3ed0","fromSide":"right","toNode":"9b47a5cdb3cf5982","toSide":"left","color":"5"},{"id":"6403d1d9d40a2d6a","fromNode":"76ce4b8acbde3ed0","fromSide":"right","toNode":"864346e8bb67f334","toSide":"left"},{"id":"09dd58e3890d6d03","fromNode":"8805a7e8617486fb","fromSide":"right","toNode":"76ce4b8acbde3ed0","toSide":"left","color":"5"},{"id":"7183b7ec87a5f359","fromNode":"b2fff01809c4fabb","fromSide":"right","toNode":"bbfef1070ca6c01f","toSide":"left","color":"5"},{"id":"220eb05faae830a6","fromNode":"b2fff01809c4fabb","fromSide":"right","toNode":"836dcf01cbbf9fe8","toSide":"left"},{"id":"3928cd95afead8b4","fromNode":"8805a7e8617486fb","fromSide":"right","toNode":"b2fff01809c4fabb","toSide":"left","color":"5"}]},"Карта курса/Переход с 3 этапа решения конфликтов в тему на переговоры.canvas":{"nodes":[{"id":"548d355566c3e1dc","type":"text","text":"# Переход с 3 этапа решения конфликтов в тему на переговоры","x":0,"y":221,"width":440,"height":170,"color":"5"},{"id":"007c0f2b42a060bc","type":"text","text":"Имеет смысл, чтобы решить рациональную причину, которая вызвала конфликт","x":560,"y":0,"width":380,"height":88,"color":"5"},{"id":"ecbb5797a8be46c8","type":"text","text":"Когда первая фраза","x":560,"y":110,"width":380,"height":62,"color":"5"},{"id":"bde7ffe95450e22e","type":"text","text":"Когда смешанный конфликт","x":560,"y":194,"width":380,"height":62,"color":"5"},{"id":"b1b9e61426c7232f","type":"text","text":"Когда публичный конфликт","x":560,"y":278,"width":380,"height":62,"color":"5"},{"id":"2da518914e9edb1e","type":"text","text":"Я слышу, что ты считаешь, что мы не справились с наймом людей к тебе, давай посмотрим, что стоит...","x":560,"y":362,"width":380,"height":114},{"id":"c1f4be0c952803d9","type":"text","text":"Главное не забыть, что после решения «темы на переговоры» нужно вернуться к цели на конфликт","x":560,"y":498,"width":380,"height":114,"color":"5"},{"id":"94018d4cafc17438","type":"text","text":"↑ [[Карта курса/Защита границ. Третий этап работы с конфликтом.canvas]]","x":0,"y":111,"width":440,"height":70}],"edges":[{"id":"620a4f15d3f9df57","fromNode":"548d355566c3e1dc","fromSide":"right","toNode":"007c0f2b42a060bc","toSide":"left","color":"5"},{"id":"c70842f5cea7d552","fromNode":"548d355566c3e1dc","fromSide":"right","toNode":"ecbb5797a8be46c8","toSide":"left","color":"5"},{"id":"801e79abfd01be73","fromNode":"548d355566c3e1dc","fromSide":"right","toNode":"bde7ffe95450e22e","toSide":"left","color":"5"},{"id":"e40c81571ad834af","fromNode":"548d355566c3e1dc","fromSide":"right","toNode":"b1b9e61426c7232f","toSide":"left","color":"5"},{"id":"070e6b8e75cc4a5b","fromNode":"548d355566c3e1dc","fromSide":"right","toNode":"c1f4be0c952 <script>
(() => {
  const ROOT = "Карта курса.canvas";
  const COLORS = { "1": "--c1", "2": "--c2", "3": "--c3", "4": "--c4", "5": "--c5", "6": "--c6" };
  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  const trailEl = document.getElementById("trail");
  const stateEl = document.getElementById("state");
  const upBtn = document.getElementById("up");
  let DATA = {}, ids = {}, byId = {}, parentOf = {}, current = ROOT;
  let view = { x: 0, y: 0, k: 1 };

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const titleOf = p => {
    const d = DATA[p];
    if (d) {
      const h = d.nodes.find(n => /^#\s/.test(n.text || ""));
      if (h) return plain(h.text.split("\n")[0].replace(/^#+\s*/, ""));
    }
    return p.split("/").pop().replace(/\.canvas$/, "");
  };
  const plain = s => s.replace(/\*\*/g, "").replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, "$2").replace(/\[\[([^\]]+)\]\]/g, (m, a) => a.split("/").pop().replace(/\.canvas$/, ""));

  function inline(s) {
    let out = esc(s);
    out = out.replace(/\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]/g, (m, target, alias) => {
      const t = target.trim();
      const label = alias || t.split("/").pop().replace(/\.canvas$/, "");
      if (DATA[t]) return `<button type="button" class="lnk" data-go="${ids[t]}">${label}</button>`;
      return `<span>${label}</span>`;
    });
    out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return out;
  }
  function md(text) {
    return (text || "").split("\n").map(line => {
      const m = line.match(/^(#{1,3})\s+(.*)$/);
      if (m) return `<div class="h${m[1].length}">${inline(m[2])}</div>`;
      if (!line.trim()) return "";
      return `<p>${inline(line)}</p>`;
    }).join("");
  }

  function anchor(n, side) {
    const cx = n.x + n.width / 2, cy = n.y + n.height / 2;
    if (side === "left") return [n.x, cy];
    if (side === "right") return [n.x + n.width, cy];
    if (side === "top") return [cx, n.y];
    if (side === "bottom") return [cx, n.y + n.height];
    return [cx, cy];
  }
  const dirs = { left: [-1, 0], right: [1, 0], top: [0, -1], bottom: [0, 1] };

  function render(path) {
    const d = DATA[path];
    world.innerHTML = "";
    if (!d) return;
    const nodes = {};
    d.nodes.forEach(n => nodes[n.id] = n);
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    d.nodes.forEach(n => { minX = Math.min(minX, n.x); minY = Math.min(minY, n.y); maxX = Math.max(maxX, n.x + n.width); maxY = Math.max(maxY, n.y + n.height); });
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("width", "1"); svg.setAttribute("height", "1");
    const defs = document.createElementNS(ns, "defs");
    svg.appendChild(defs);
    const markers = {};
    const marker = col => {
      const key = col || "none";
      if (markers[key]) return markers[key];
      const id = "arr-" + key;
      const mk = document.createElementNS(ns, "marker");
      mk.setAttribute("id", id); mk.setAttribute("viewBox", "0 0 10 10"); mk.setAttribute("refX", "9"); mk.setAttribute("refY", "5");
      mk.setAttribute("markerWidth", "7"); mk.setAttribute("markerHeight", "7"); mk.setAttribute("orient", "auto-start-reverse");
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", "M0,0 L10,5 L0,10 z");
      p.setAttribute("fill", col ? `var(${COLORS[col]})` : "var(--line)");
      mk.appendChild(p); defs.appendChild(mk);
      return markers[key] = id;
    };
    d.edges.forEach(e => {
      const a = nodes[e.fromNode], b = nodes[e.toNode];
      if (!a || !b) return;
      const fs = e.fromSide || "right", ts = e.toSide || "left";
      const [x1, y1] = anchor(a, fs), [x2, y2] = anchor(b, ts);
      const dist = Math.max(40, Math.hypot(x2 - x1, y2 - y1) * .4);
      const [dx1, dy1] = dirs[fs] || [1, 0], [dx2, dy2] = dirs[ts] || [-1, 0];
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", `M${x1},${y1} C${x1 + dx1 * dist},${y1 + dy1 * dist} ${x2 + dx2 * dist},${y2 + dy2 * dist} ${x2},${y2}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", e.color && COLORS[e.color] ? `var(${COLORS[e.color]})` : "var(--line)");
      path.setAttribute("stroke-width", "2.5");
      if (e.toEnd !== "none") path.setAttribute("marker-end", `url(#${marker(COLORS[e.color] ? e.color : null)})`);
      if (e.fromEnd === "arrow") path.setAttribute("marker-start", `url(#${marker(COLORS[e.color] ? e.color : null)})`);
      svg.appendChild(path);
    });
    world.appendChild(svg);
    d.nodes.forEach(n => {
      const el = document.createElement("div");
      el.className = "node";
      el.style.left = n.x + "px"; el.style.top = n.y + "px";
      el.style.width = n.width + "px"; el.style.height = n.height + "px";
      if (n.color && COLORS[n.color]) { el.dataset.c = n.color; el.style.setProperty("--cc", `var(${COLORS[n.color]})`); }
      else if (n.color && /^#/.test(n.color)) { el.dataset.c = "x"; el.style.setProperty("--cc", n.color); }
      const text = n.type === "text" ? n.text : n.type === "file" ? `[[${n.file}]]` : n.type === "link" ? n.url : (n.label || "");
      if (/^↑\s/.test(text || "")) el.classList.add("up");
      el.innerHTML = md(text);
      const links = el.querySelectorAll(".lnk");
      if (links.length === 1) {
        el.classList.add("has-link");
        el.addEventListener("click", ev => { if (!ev.target.closest(".lnk") && !moved) go(byId[links[0].dataset.go]); });
      }
      world.appendChild(el);
    });
    world.dataset.bounds = JSON.stringify([minX, minY, maxX, maxY]);
  }

  function apply() { world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`; }
  function fit() {
    const [minX, minY, maxX, maxY] = JSON.parse(world.dataset.bounds || "[0,0,1,1]");
    const r = stage.getBoundingClientRect();
    const pad = 32, w = maxX - minX, h = maxY - minY;
    const k = Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h, 1.2);
    // on narrow screens a tall map would shrink to nothing; keep text readable and start at the top
    const kk = Math.max(k, 0.6);
    view.k = kk;
    view.x = w * kk < r.width - pad * 2 ? (r.width - w * kk) / 2 - minX * kk : pad - minX * kk;
    view.y = h * kk < r.height - pad * 2 ? (r.height - h * kk) / 2 - minY * kk : pad - minY * kk;
    apply();
  }
  function zoomAt(f, cx, cy) {
    const k = Math.min(3, Math.max(0.08, view.k * f));
    view.x = cx - (cx - view.x) * (k / view.k);
    view.y = cy - (cy - view.y) * (k / view.k);
    view.k = k; apply();
  }

  function chain(p) { const c = [p]; const seen = new Set([p]); while (parentOf[c[0]] && !seen.has(parentOf[c[0]])) { c.unshift(parentOf[c[0]]); seen.add(c[0]); } return c; }
  function drawTrail() {
    const c = chain(current);
    trailEl.innerHTML = c.map((p, i) => i === c.length - 1
      ? `<span class="here" aria-current="page">${esc(titleOf(p))}</span>`
      : `<button type="button" data-go="${ids[p]}">${esc(titleOf(p))}</button><span class="sep">›</span>`).join("");
    upBtn.disabled = !parentOf[current];
    document.title = current === ROOT ? "Карта курса" : titleOf(current) + " · Карта курса";
  }
  function go(path, fromHash) {
    if (!DATA[path]) path = ROOT;
    current = path;
    render(path); fit(); drawTrail();
    const h = path === ROOT ? "" : ids[path];
    if (!fromHash && location.hash.slice(1) !== h) {
      if (h) location.hash = h; else history.replaceState(null, "", location.pathname + location.search);
    }
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (b && !moved) { e.preventDefault(); go(byId[b.dataset.go]); }
  });
  upBtn.addEventListener("click", () => parentOf[current] && go(parentOf[current]));
  document.getElementById("fit").addEventListener("click", () => {
    // full overview, even if text gets small
    const [minX, minY, maxX, maxY] = JSON.parse(world.dataset.bounds || "[0,0,1,1]");
    const r = stage.getBoundingClientRect(), pad = 24, w = maxX - minX, h = maxY - minY;
    const k = Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h, 1.2);
    view.k = k; view.x = (r.width - w * k) / 2 - minX * k; view.y = (r.height - h * k) / 2 - minY * k; apply();
  });
  document.getElementById("zin").addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); });
  document.getElementById("zout").addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); });
  window.addEventListener("hashchange", () => { const p = byId[location.hash.slice(1)] || ROOT; if (p !== current) go(p, true); });

  // pan and pinch
  const pts = new Map(); let last = null, moved = false, startDist = 0, startK = 1;
  stage.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    if (pts.size === 2) { const [a, b] = [...pts.values()]; startDist = Math.hypot(a.x - b.x, a.y - b.y); startK = view.k; }
    last = { x: e.clientX, y: e.clientY };
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = stage.getBoundingClientRect();
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((startK * dist / startDist) / view.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      moved = true; return;
    }
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    if (!moved) { moved = true; stage.setPointerCapture(e.pointerId); stage.classList.add("drag"); }
    view.x += dx; view.y += dy; last = { x: e.clientX, y: e.clientY }; apply();
  });
  const end = e => { pts.delete(e.pointerId); stage.classList.remove("drag"); if (pts.size === 1) last = [...pts.values()][0]; setTimeout(() => { if (!pts.size) moved = false; }, 0); };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey) zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
    else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
  }, { passive: false });
  window.addEventListener("resize", () => fit());

  Promise.resolve(window.KARTA_DATA).then(data => {
    DATA = data;
    Object.keys(DATA).sort().forEach((p, i) => { const id = p === ROOT ? "glavnaya" : "m" + i; ids[p] = id; byId[id] = p; });
    for (const [p, d] of Object.entries(DATA)) {
      d.nodes.forEach(n => {
        if (/^↑\s/.test(n.text || "")) return;
        for (const m of (n.text || "").matchAll(/\[\[([^\]|]+)/g)) { const t = m[1].trim(); if (DATA[t] && t !== p && !parentOf[t] && t !== ROOT) parentOf[t] = p; }
      });
    }
    stateEl.hidden = true;
    go(byId[location.hash.slice(1)] || ROOT, true);
  }).catch(() => { stateEl.textContent = "Не удалось загрузить карту. Обнови страницу."; });
})();
</script>

</body>
</html>
